name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Base PostgreSQL éphémère de la CI (service ci-dessous), aucune donnée réelle.
  DATABASE_URL: postgresql://ci:ci-local-only@localhost:5432/ortho_ci?schema=public

jobs:
  verifications:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: ortho_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ortho_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migration et seed sur la base vide
        run: |
          pnpm --filter @app/db migrate:deploy
          pnpm db:seed
        env:
          SEED_PASSWORD: motdepasse-fictif-ci

  e2e:
    name: Tests de bout en bout (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm --filter @app/web build
      - run: pnpm test:e2e
